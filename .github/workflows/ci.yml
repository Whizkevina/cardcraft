name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cardcraft
          POSTGRES_PASSWORD: cardcraft
          POSTGRES_DB: cardcraft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cardcraft:cardcraft@localhost:5432/cardcraft_test
      SESSION_SECRET: ci-test-session-secret-minimum-32-chars
      NODE_ENV: development
      PORT: 5000
      HOST: 127.0.0.1
      E2E_BASE_URL: http://127.0.0.1:5000
      E2E_RESET_DB: "true"
      PAYSTACK_SECRET_KEY: sk_test_placeholder
      PAYSTACK_PUBLIC_KEY: pk_test_placeholder
      APP_URL: http://127.0.0.1:5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run e2e tests
        run: npm run test:e2e
